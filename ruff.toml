# Ruff Linter Configuration
# Reference: https://docs.astral.sh/ruff/

target-version = "py312"
line-length = 100
exclude = [
    ".git", ".tox", ".venv", "venv", "env", "dist", "build",
    "*.egg-info", "__pycache__", ".pyc", ".pyo", ".so",
    ".dll", ".exe", "docs/build", "reports/.coverage", "coverage.xml"
]

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "PL", "RUF", "SIM", "D", "N"]
ignore = [
    "D100", "D104", "D105", "D203", "D213",
    "PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLW0603",
    "C901", "E501", "B008", "B019"
]

[format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = true

[lint.per-file-ignores]
"tests/__init__.py" = ["D", "F"]
"tests/**/__init__.py" = ["D", "F"]
"platforms/**/demo.py" = ["PLR0913", "PLR2004"]
"Qwen3-TTS/**/*.py" = ["ALL"]