name: Code Quality

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    name: Ruff Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Ruff
      run: pip install ruff

    - name: Run Ruff
      run: ruff check . || true

  type-check:
    name: Mypy Type Checking
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Mypy
      run: pip install mypy

    - name: Run Mypy
      run: |
        if [ -d "core" ]; then
          mypy core/ --ignore-missing-imports || true
        else
          echo "No core/ directory found, skipping type check"
        fi
      shell: bash

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit
      run: |
        if [ -d "core" ]; then
          bandit -r core/ || true
        else
          echo "No core/ directory found, skipping security scan"
        fi
      shell: bash
